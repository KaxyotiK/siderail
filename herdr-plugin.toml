id = "local.git-rail"
name = "Herdr GitRail"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "A trustworthy, read-only Git sidebar for one repository and branch"
platforms = ["macos", "linux"]

[[startup]]
command = ["node", "scripts/auto-open-herdr-workspaces.mjs"]

[[events]]
on = "workspace.created"
command = ["node", "scripts/auto-open-herdr-workspaces.mjs"]

[[actions]]
id = "open-git-rail"
title = "Open GitRail"
contexts = ["workspace"]
command = ["bash", "scripts/open-herdr-panel.sh", "git-tui"]

[[actions]]
id = "open-git-rail-mockup"
title = "Open GitRail Demo"
contexts = ["workspace"]
command = ["bash", "scripts/open-herdr-panel.sh", "git-mockup"]

[[panes]]
id = "git-tui"
title = "HERDER GITRAIL"
description = "Read-only Git inspection for the focused repository"
placement = "overlay"
command = ["node", "scripts/git-rail.mjs"]

[[panes]]
id = "git-mockup"
title = "GitRail Demo"
description = "Deterministic GitRail demo derived from a real fixture repository"
placement = "overlay"
command = ["node", "scripts/git-rail.mjs", "--demo"]

[[panes]]
id = "file-preview"
title = "GitRail Preview"
description = "Exact descriptor-aware diff and file preview"
placement = "tab"
command = ["node", "scripts/file-preview.mjs"]
