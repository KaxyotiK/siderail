name: Dependency audit

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Full base commit SHA
        required: true
        type: string
      head_ref:
        description: Full candidate commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    env:
      BASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref || github.event.pull_request.base.sha }}
      HEAD_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.head_ref || github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_ref || github.event.pull_request.head.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Verify refs and review dependency changes
        run: |
          set -euo pipefail
          test "$(git rev-parse "$HEAD_REF")" = "$HEAD_REF"
          git cat-file -e "$BASE_REF^{commit}"
          git diff --exit-code "$HEAD_REF" -- package.json package-lock.json
          git diff --stat "$BASE_REF" "$HEAD_REF" -- package.json package-lock.json
          git diff "$BASE_REF" "$HEAD_REF" -- package.json package-lock.json
          node -e 'const p=require("./package.json"); if (p.dependencies && Object.keys(p.dependencies).length) throw new Error("runtime dependencies must remain empty")'
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
