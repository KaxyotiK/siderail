name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run snapshot
      - run: npm run artifact:verify

  poisoned-environment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Create hostile Herdr witness
        run: |
          printf '%s\n' '#!/bin/sh' 'echo "poisoned HERDR_BIN_PATH escaped the test helper" >&2' 'exit 97' > "$RUNNER_TEMP/hostile-herdr"
          chmod 700 "$RUNNER_TEMP/hostile-herdr"
      - name: Run with poisoned parent environment
        env:
          HERDR_PANE_ID: hostile-pane-id
          HERDR_BIN_PATH: ${{ runner.temp }}/hostile-herdr
        run: npm run check

  demo-snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run snapshot
      - run: npm run artifact:verify

  live-herdr-ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install pinned Herdr and Glow binaries
        env:
          HERDR_SHA256: 976150a14d490c94b243ea2e1a7eb2dfb67f12e36b182db90936f6728e6aecf4
          GLOW_SHA256: 6063d4f2af8a82a5f4bba0831e165de9381660aa8b41df4816d0106a265b07d5
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitrail-live-bin" "$RUNNER_TEMP/gitrail-live-glow"
          curl --fail --show-error --silent --location \
            https://github.com/herdrdev/herdr/releases/download/v0.8.2/herdr-linux-x86_64 \
            --output "$RUNNER_TEMP/herdr-linux-x86_64"
          printf '%s  %s\n' "$HERDR_SHA256" "$RUNNER_TEMP/herdr-linux-x86_64" | sha256sum --check
          install -m 755 "$RUNNER_TEMP/herdr-linux-x86_64" "$RUNNER_TEMP/gitrail-live-bin/herdr"
          curl --fail --show-error --silent --location \
            https://github.com/charmbracelet/glow/releases/download/v2.1.2/glow_2.1.2_Linux_x86_64.tar.gz \
            --output "$RUNNER_TEMP/glow.tar.gz"
          printf '%s  %s\n' "$GLOW_SHA256" "$RUNNER_TEMP/glow.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/glow.tar.gz" -C "$RUNNER_TEMP/gitrail-live-glow"
          install -m 755 "$RUNNER_TEMP/gitrail-live-glow/glow_2.1.2_Linux_x86_64/glow" "$RUNNER_TEMP/gitrail-live-bin/glow"
          ln -s /usr/bin/git "$RUNNER_TEMP/gitrail-live-bin/git"
          ln -s "$(command -v node)" "$RUNNER_TEMP/gitrail-live-bin/node"
          ln -s /bin/bash "$RUNNER_TEMP/gitrail-live-bin/bash"
          "$RUNNER_TEMP/gitrail-live-bin/herdr" --version
          "$RUNNER_TEMP/gitrail-live-bin/glow" --version
      - name: Run clean-install live Herdr walkthrough and unlink proof
        env:
          HERDR_SESSION: gitrail-release-ci
          XDG_CONFIG_HOME: ${{ runner.temp }}/gitrail-live-config
          XDG_CACHE_HOME: ${{ runner.temp }}/gitrail-live-cache
          HERDR_BIN_PATH: ${{ runner.temp }}/gitrail-live-bin/herdr
          GIT_RAIL_LIVE_GIT_SHIM: ${{ runner.temp }}/gitrail-live-bin/git
          GIT_RAIL_POLL_INTERVAL_MS: 1000
        run: |
          set -euo pipefail
          server_pid=""
          old_checkout=""
          cleanup() {
            set +e
            "$HERDR_BIN_PATH" plugin unlink local.git-rail >/dev/null 2>&1
            "$HERDR_BIN_PATH" session stop "$HERDR_SESSION" --json >/dev/null 2>&1
            if [[ -n "$server_pid" ]]; then wait "$server_pid" >/dev/null 2>&1; fi
            if [[ -n "$old_checkout" && -d "$old_checkout" ]]; then
              git worktree remove --force "$old_checkout" >/dev/null 2>&1
            fi
          }
          trap cleanup EXIT
          start_server() {
            env PATH="$RUNNER_TEMP/gitrail-live-bin" \
              GIT_RAIL_NODE_PATH="$(command -v node)" \
              "$HERDR_BIN_PATH" server &
            server_pid=$!
            for _ in $(seq 1 100); do
              if "$HERDR_BIN_PATH" status server >/dev/null 2>&1; then return; fi
              sleep 0.1
            done
            return 1
          }
          start_server
          "$HERDR_BIN_PATH" plugin link .
          npm run live:herdr:smoke
          "$HERDR_BIN_PATH" plugin unlink local.git-rail
          test "$("$HERDR_BIN_PATH" plugin list)" = "No plugins installed."
          "$HERDR_BIN_PATH" session stop "$HERDR_SESSION" --json
          wait "$server_pid"
          server_pid=""
          start_server
          test "$("$HERDR_BIN_PATH" plugin list)" = "No plugins installed."
          unlink_proof=$("$HERDR_BIN_PATH" workspace create --cwd "$GITHUB_WORKSPACE" --label "GitRail unlink proof" --no-focus)
          unlink_proof_tab=$(jq -r '.result.tab.tab_id' <<<"$unlink_proof")
          sleep 1
          if "$HERDR_BIN_PATH" pane list | jq -e --arg tab "$unlink_proof_tab" \
            '.result.panes[] | select(.tab_id == $tab and .label == "HERDER GITRAIL")' >/dev/null; then
            echo "GitRail event action remained after unlink" >&2
            exit 1
          fi
          "$HERDR_BIN_PATH" session stop "$HERDR_SESSION" --json
          wait "$server_pid"
          server_pid=""

          export HERDR_SESSION=gitrail-migration-ci
          start_server
          old_checkout="$RUNNER_TEMP/gitrail-old-candidate"
          git worktree add --detach "$old_checkout" 6c7d9ac
          mkdir -p "$HOME/.config/git-rail" "$XDG_CONFIG_HOME/git-rail"
          node -e 'require("node:fs").writeFileSync(process.argv[1], `${JSON.stringify({ $schema: "schema/v1/git-rail.schema.json", version: 1, baseRef: "HEAD" }, null, 2)}\n`)' \
            "$HOME/.config/git-rail/config.json"
          node -e 'require("node:fs").writeFileSync(process.argv[1], `${JSON.stringify({ version: 1, baseRef: "HEAD" }, null, 2)}\n`)' \
            "$old_checkout/.git-rail.json"
          "$HERDR_BIN_PATH" plugin link "$old_checkout"
          migration_workspace=$("$HERDR_BIN_PATH" workspace create --cwd "$old_checkout" --label "GitRail migration" --no-focus)
          migration_workspace_id=$(jq -r '.result.workspace.workspace_id' <<<"$migration_workspace")
          migration_tab_id=$(jq -r '.result.tab.tab_id' <<<"$migration_workspace")
          for _ in $(seq 1 100); do
            old_rail=$("$HERDR_BIN_PATH" pane list | jq -r --arg tab "$migration_tab_id" \
              '.result.panes[] | select(.tab_id == $tab and .label == "HERDER GITRAIL") | .pane_id')
            if [[ -n "$old_rail" ]]; then break; fi
            sleep 0.1
          done
          test -n "$old_rail"
          old_state="$XDG_CACHE_HOME/herdr-gitrail/panes/${migration_workspace_id}-${migration_tab_id}-git-tui"
          for _ in $(seq 1 100); do
            if [[ -f "$old_state" && "$(sed -n '1p' "$old_state")" = "$old_rail" ]]; then break; fi
            sleep 0.1
          done
          test "$(sed -n '1p' "$old_state")" = "$old_rail"

          node -e 'require("node:fs").writeFileSync(process.argv[1], `${JSON.stringify({ version: 1, baseRef: "HEAD" }, null, 2)}\n`)' \
            "$XDG_CONFIG_HOME/git-rail/config.json"
          migrated_config_sha=$(sha256sum "$XDG_CONFIG_HOME/git-rail/config.json")
          "$HERDR_BIN_PATH" plugin link .
          "$HERDR_BIN_PATH" tab focus "$migration_tab_id"
          "$HERDR_BIN_PATH" plugin action invoke local.git-rail.toggle-git-rail
          for _ in $(seq 1 100); do
            if ! "$HERDR_BIN_PATH" pane list | jq -e --arg tab "$migration_tab_id" \
              '.result.panes[] | select(.tab_id == $tab and .label == "HERDER GITRAIL")' >/dev/null; then break; fi
            sleep 0.1
          done
          if "$HERDR_BIN_PATH" pane list | jq -e --arg tab "$migration_tab_id" \
            '.result.panes[] | select(.tab_id == $tab and .label == "HERDER GITRAIL")' >/dev/null; then exit 1; fi
          "$HERDR_BIN_PATH" plugin action invoke local.git-rail.open-git-rail
          for _ in $(seq 1 100); do
            candidate_rail=$("$HERDR_BIN_PATH" pane list | jq -r --arg tab "$migration_tab_id" \
              '.result.panes[] | select(.tab_id == $tab and .label == "HERDER GITRAIL") | .pane_id')
            if [[ -n "$candidate_rail" ]]; then break; fi
            sleep 0.1
          done
          test -n "$candidate_rail"
          for _ in $(seq 1 100); do
            if [[ -f "$old_state" && "$(sed -n '1p' "$old_state")" = "$candidate_rail" ]]; then break; fi
            sleep 0.1
          done
          test "$(sed -n '1p' "$old_state")" = "$candidate_rail"
          test "$(sha256sum "$XDG_CONFIG_HOME/git-rail/config.json")" = "$migrated_config_sha"
          "$HERDR_BIN_PATH" plugin list | grep -F "local:$GITHUB_WORKSPACE"
          "$HERDR_BIN_PATH" plugin unlink local.git-rail
          "$HERDR_BIN_PATH" session stop "$HERDR_SESSION" --json
          wait "$server_pid"
          server_pid=""
          start_server
          test "$("$HERDR_BIN_PATH" plugin list)" = "No plugins installed."
          migration_unlink_proof=$("$HERDR_BIN_PATH" workspace create --cwd "$GITHUB_WORKSPACE" --label "GitRail migration unlink proof" --no-focus)
          migration_unlink_tab=$(jq -r '.result.tab.tab_id' <<<"$migration_unlink_proof")
          sleep 1
          if "$HERDR_BIN_PATH" pane list | jq -e --arg tab "$migration_unlink_tab" \
            '.result.panes[] | select(.tab_id == $tab and .label == "HERDER GITRAIL")' >/dev/null; then
            echo "GitRail event action remained after development-migration unlink" >&2
            exit 1
          fi
          git worktree remove --force "$old_checkout"
          old_checkout=""
